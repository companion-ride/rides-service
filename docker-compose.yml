services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - ${PORT}:${PORT}
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PATHFINDER_URL: ${PATHFINDER_URL}
      LOCATION_SERVICE_URL: ${LOCATION_SERVICE_URL}
      MAX_PASSENGERS: ${MAX_PASSENGERS}
      PICKUP_RADIUS_M: ${PICKUP_RADIUS_M}
      DROPOFF_RADIUS_M: ${DROPOFF_RADIUS_M}
      MIN_ETA_SECONDS: ${MIN_ETA_SECONDS}
      DOUBLE_GIS_API_KEY: ${DOUBLE_GIS_API_KEY}
    depends_on:
      psql_bp:
        condition: service_healthy
    networks:
      - blueprint
      - pathfinder_blueprint
  psql_bp:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - blueprint

volumes:
  psql_volume_bp:
networks:
  blueprint:
    external: true
  pathfinder_blueprint:
    external: true
